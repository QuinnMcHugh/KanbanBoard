services:
  - type: web
    runtime: static
    name: kanban-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback: any path that isn't a real file in dist/ (e.g. /signup,
      # or /projects/42 on a hard refresh) still gets served index.html with a
      # 200, so client-side routing (react-router-dom) can take over instead
      # of the static host 404ing on paths it doesn't recognize as real files.
      - type: rewrite
        source: /*
        destination: /index.html
